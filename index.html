<style>
/* Layout: a desk of loose paper squares, one thin toolbar at the bottom, a clock in the corner. */
:root{
  --desk:#e7e8ea; --paper:#ffffff; --edge:rgba(0,0,0,.10); --fg:#1b1b1a; --muted:#7d7f84; --bar:#ffffff; --line:#dcdde0; --mine:#1f5fd1;
  --ink0:#1b1b1a; --ink1:#d23a2a; --ink2:#1f5fd1; --ink3:#1f8a4c; --ink4:#e0a100;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --desk:#0e0f11; --paper:#1d1e21; --edge:rgba(255,255,255,.08); --fg:#ececea; --muted:#83868c; --bar:#1d1e21; --line:#2e3034; --mine:#6b9dff;
  --ink0:#ececea; --ink1:#ff6a55; --ink2:#6b9dff; --ink3:#4fcf86; --ink4:#ffcc33; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--fg);font:14px/1.4 var(--ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c.draw{cursor:crosshair} #c.text{cursor:text} #c.grabbing{cursor:grabbing}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tools{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1px;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:5px 6px;max-width:100%}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
button{font:inherit;color:var(--fg);background:none;border:0;border-radius:8px;padding:6px 10px;min-height:34px;cursor:pointer}
button:hover{background:var(--line)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bar)}
button:focus-visible{outline:2px solid var(--mine);outline-offset:2px}
button:disabled{opacity:.35;cursor:default;background:none}
button.icon{display:grid;place-items:center;padding:5px;min-width:34px}
button.primary{background:var(--mine);color:#fff}
.dot{width:24px;height:24px;min-height:0;padding:3px;border-radius:50%;border:2px solid transparent}
.dot i{display:block;width:100%;height:100%;border-radius:50%;background:var(--c)}
.dot[aria-pressed="true"]{background:none;border-color:var(--fg)}
#inks{display:flex;gap:0}
.corner{position:fixed;top:calc(12px + env(safe-area-inset-top));color:var(--muted);font-size:12px;pointer-events:none;font-variant-numeric:tabular-nums}
#clock{right:max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:5px}
#note{left:max(16px,env(safe-area-inset-left));max-width:55vw;text-align:left}
#hint{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);opacity:.6;pointer-events:none}
#tp{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:20}
#tpa{font:inherit;font-size:17px;line-height:1.45;width:100%;min-height:120px;max-height:40vh;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);outline:none;direction:auto}
#tpa:focus{border-color:var(--mine)}
#tp.over #tpa{border-color:var(--ink1)}
#tp .row{display:flex;align-items:center;gap:4px}
#tpc{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding:0 4px;margin-inline-end:auto}
#tp.over #tpc{color:var(--ink1)}
#tpok{background:var(--fg);color:var(--bar)}
#reply{position:fixed;z-index:15;transform:translate(-50%,0);background:var(--bar);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;min-height:0;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#namebox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px;color:var(--muted);max-width:calc(100% - 32px)}
#namebox input{font:inherit;font-size:15px;width:12em;max-width:52vw;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--fg);text-align:center;direction:auto}
#admin{display:flex;gap:4px;align-items:center}

#apw{display:flex;align-items:center;gap:2px;margin:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</div>

<div id="bar"><div class="tools" role="toolbar">
  <button id="m-draw" class="icon" aria-pressed="true" aria-label="עט" title="עט"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4.5L16 4.5a2.1 2.1 0 013 3L8 18.5 4 20z"/><path d="M14 6.5l3.5 3.5"/></svg></button>
  <button id="m-text" class="icon" aria-pressed="false" aria-label="טקסט" title="טקסט"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6.5V5h14v1.5"/><path d="M12 5v14"/><path d="M9.5 19h5"/></svg></button>
  <button id="m-move" class="icon" aria-pressed="false" aria-label="הזזה" title="הזזה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18"/><path d="M9.5 5.5L12 3l2.5 2.5M9.5 18.5L12 21l2.5-2.5M5.5 9.5L3 12l2.5 2.5M18.5 9.5L21 12l-2.5 2.5"/></svg></button>
  <span class="sep"></span>
  <span id="inks"></span>
  <button id="undo" class="mineonly icon" hidden disabled aria-label="מחק את האחרון" title="מחק את האחרון"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 12.5h9l1-12.5"/><path d="M10 11v5M14 11v5"/></svg></button>
  <span class="sep"></span>
  <button id="me" class="icon" aria-label="השם שלי" title="השם שלי" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></button>
  <button id="net" class="icon" aria-pressed="false" aria-label="רשת" title="רשת"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="10" r="5.5"/><circle cx="17.5" cy="16.5" r="3"/><circle cx="17" cy="5.5" r="2"/></svg></button>
  <span id="admin" hidden><span class="sep"></span><span id="gbtn" title="כניסת מנהל" hidden></span><form id="apw" hidden><input id="apwi" type="password" autocomplete="current-password" placeholder="••••••••" aria-label="סיסמת מנהל"><button id="apwb" class="icon" type="submit" aria-label="כניסה" title="כניסה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg></button></form><span id="atools" hidden style="display:contents"><span id="ashield" class="icon" title="מצב מנהל" style="color:var(--ink1);display:grid;place-items:center;padding:0 4px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/></svg></span><button id="aitem" class="icon" disabled aria-label="מחק קו" title="מחק קו"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 20H20"/><path d="M4.6 14.6l8.9-8.9a2 2 0 012.8 0l2.5 2.5a2 2 0 010 2.8L11 19.8a1 1 0 01-.7.2H7.9a1 1 0 01-.7-.3l-2.6-2.6a1.8 1.8 0 010-2.5z"/><path d="M9.5 9.7l5 5"/></svg></button><button id="adel" class="icon" disabled aria-label="מחק ציור" title="מחק ציור"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg></button><button id="aout" class="icon" aria-label="יציאה" title="יציאה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></button></span></span>
</div></div>

<script>
(() => {
'use strict';
const S = 360;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const note = t => { $('note').textContent = t || ''; };

// ---------- identity (per browser) ----------
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} },
};
let token = store.get('bp-token');
if(!token){ const a=new Uint8Array(18); crypto.getRandomValues(a); token=btoa(String.fromCharCode(...a)).replace(/[+/=]/g,c=>({'+':'-','/':'_','=':''}[c])); store.set('bp-token',token); }
const rid = () => Math.random().toString(36).slice(2,10);
const pick = a => a[Math.floor(Math.random()*a.length)];
const randomName = () => pick(['Quiet','Blue','Sleepy','Swift','Curious','Cheerful','Calm','Bold','Shy','Dreamy','Nimble','Polite'])+' '+
  pick(['Owl','Fox','Dolphin','Turtle','Hedgehog','Zebra','Tiger','Otter','Penguin','Octopus','Squirrel','Whale']);
// names the page picked in Hebrew before switching to English; a name someone typed themselves is kept
const oldAuto = /^(ינשוף|שועל|דולפין|צב|קיפוד|זברה|נמר|לוטרה|פינגווין|תמנון|סנאי|לוויתן) (שקט|כחול|ישנוני|מהיר|סקרן|עליז|רגוע|נועז|ביישן|חולמני|זריז|מנומס)$/;
let myName = store.get('bp-name');
if(!myName || oldAuto.test(myName)){ myName = randomName(); store.set('bp-name', myName); }

// ---------- state ----------
let day = null, lastV = 0;
const applied = new Set();
const squares = new Map();          // sq -> {x,y,r,z,items:[]}
let mySq = null, mode = 'draw', ink = 0, net = false;   // mySq = the creation you last worked on
const mine = new Set();                                    // all your creations today (temp ids start with "_")
const MAX_MINE = 10;
const saveMine = () => store.set('bp-sqs-'+day, JSON.stringify([...mine].filter(id=>!id.startsWith('_'))));
function loadMine(){ mine.clear(); try{ JSON.parse(store.get('bp-sqs-'+day)||'[]').forEach(id=>mine.add(id)); }catch{} const old=store.get('bp-sq-'+day); if(old) mine.add(old); mySq=[...mine].pop()||null; }
let view = {x: innerWidth/2, y: innerHeight/2.3, s: Math.min(1, innerWidth/(S*1.4))};
let counts = {};
let pendingMove = 0;

// ---------- colors ----------
let col = {};
function readColors(){
  const st = getComputedStyle(document.documentElement);
  for(const n of ['desk','paper','edge','fg','muted','mine','ink0','ink1','ink2','ink3','ink4']) col[n]=st.getPropertyValue('--'+n).trim();
  draw();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

// ---------- events from server ----------
function apply(e){
  if(applied.has(e.v)) return; applied.add(e.v);
  if(e.t==='sq'){
    let q = squares.get(e.sq);
    if(!q){ q={x:e.x,y:e.y,r:e.r,z:e.z,items:[]}; squares.set(e.sq,q); }
    if(e.name) q.name = e.name;
    if(e.re) q.re = e.re;
    if(!(mine.has(e.sq) && (pendingMove>0 || (drag && drag.sq===e.sq)))){ q.x=e.x; q.y=e.y; q.r=e.r; }
    q.z = Math.max(q.z, e.z);
  } else if(e.t==='del'){
    squares.delete(e.sq);
    if(mine.has(e.sq)){ mine.delete(e.sq); saveMine(); if(mySq===e.sq) mySq=[...mine].pop()||null; ui(); note('יצירה שלך הוסרה.'); }
    if(e.sq===adminSel){ adminSel=null; adminItem=null; if(admin) adminUi(); }
  } else {
    const q = squares.get(e.sq); if(!q) return;
    if(e.t==='un'){ q.items = q.items.filter(i=>i.id!==e.id); return; }
    if(e.t==='nm'){ q.name = e.name; return; }
    if(e.t==='te'){ const it=q.items.find(i=>i.id===e.id); if(it){ Object.assign(it,{ink:e.ink,size:e.size,x:e.x,y:e.y,text:e.text}); delete it._lines; delete it._bw; } return; }
    if(!q.items.some(i=>i.id===e.id)) q.items.push(e);
    q.z = Math.max(q.z, e.v);
  }
}

let polling = false, failures = 0;
async function poll(){
  if(polling || document.hidden) return; polling = true;
  try{
    const r = await fetch(`/api/events?day=${day||''}&since=${Math.max(0,lastV-30)}`, {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    if(d.reset && d.day!==day){
      squares.clear(); applied.clear(); lastV=0; counts={};
      day = d.day; loadMine(); ui();
    }
    for(const e of d.events){ apply(e); lastV=Math.max(lastV,e.v); }
    if(net && d.events.some(e=>e.t!=='nm')) layoutBubbles();   // new creations and replies join the network right away
    lastV = Math.max(lastV, d.v);
    failures = 0; if($('note').dataset.err) { note(''); delete $('note').dataset.err; }
    draw();
  }catch{
    if(++failures===3){ note('אין חיבור לשרת. מנסה שוב…'); $('note').dataset.err=1; }
  }finally{ polling=false; }
}

async function post(path, payload){
  const r = await fetch(path, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({token, day, ...payload})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===429) note(d.error==='limit' ? `הגעת ל-${d.max} יצירות היום.` : 'לאט לאט. נסו שוב בעוד דקה.');
    else if(r.status===507) note('הדף מלא להיום. בחצות הוא מתרוקן.');
    else if(r.status===403){ note(d.error==='blocked today' ? 'אי אפשר לצייר יותר היום.' : 'היצירה הזו כבר לא שלך.'); }
    else if(r.status===409) poll();
    throw d;
  }
  return d;
}

async function send(ev, sq=mySq){
  sq = sq && rs(sq);
  if(sq && sq.startsWith('_')) sq = await claims.get(sq);   // wait until a new creation exists on the server
  if(!sq) throw 0;
  return post('/api/act', {sq, ev}).then(d=>{ apply(d.ev); const q=squares.get(sq); if(q) q.z=d.ev.v; lastV=Math.max(lastV,d.ev.v); draw(); return d; });
}

// ---------- claiming ----------
const claims = new Map();   // temp id -> promise of the real id
const alias = new Map();    // temp id -> real id, once the server has made it
const rs = id => alias.get(id) || id;
function claimAt(w, opt={}){ // a new creation around where the person touched, kept fully on screen; drawing starts at once
  if(mine.size >= MAX_MINE){ note(`הגעת ל-${MAX_MINE} יצירות היום.`); spill(true); return null; }
  const barTop=document.querySelector('.tools').getBoundingClientRect().top;
  const tl=toWorld(0, 40), br=toWorld(innerWidth, barTop-12), h=S/2;
  const fit=(v,a,b)=> b-a>=S ? Math.min(Math.max(v,a+h),b-h) : (a+b)/2;
  const tid = '_'+rid(), first = mine.size===0 && !store.get('bp-named-'+day);
  const tmp = opt.exact ? {x:Math.round(w.x), y:Math.round(w.y)} : {x:Math.round(fit(w.x,tl.x,br.x)), y:Math.round(fit(w.y,tl.y,br.y))};
  Object.assign(tmp, {r:0, z:Number.MAX_SAFE_INTEGER, items:[], name:myName}, opt.re ? {re:opt.re} : {});
  squares.set(tid, tmp); mine.add(tid); mySq = tid; ui();
  const p = post('/api/claim', {x:tmp.x, y:tmp.y, name:myName, re:opt.re}).then(d=>{
    alias.set(tid, d.sq); squares.delete(tid); mine.delete(tid); squares.set(d.sq, tmp); mine.add(d.sq);
    if(mySq===tid) mySq = d.sq;
    day = d.day; saveMine();
    if(d.ev) apply(d.ev);
    if(first){ store.set('bp-named-'+day,'1'); setTimeout(()=>openName(true), 900); }
    ui(); draw(); return d.sq;
  }).catch(e=>{ squares.delete(tid); mine.delete(tid); if(mySq===tid) mySq=[...mine].pop()||null; ui(); draw(); return null; })
    .finally(()=>setTimeout(()=>claims.delete(tid), 60000));

}
// ---------- replies ----------
function freeSpotNear(P){ // next to the creation being answered, where no other creation sits
  const d=S+40;
  for(let ring=1; ring<=3; ring++) for(const deg of [0,90,180,270,45,135,225,315]){
    const a=deg*Math.PI/180, c={x:P.x+Math.cos(a)*d*ring, y:P.y+Math.sin(a)*d*ring};
    let free=true; for(const q of squares.values()) if(q!==P && Math.hypot(q.x-c.x,q.y-c.y)<S*.85){ free=false; break; }
    if(free) return c;
  }
  return {x:P.x+d, y:P.y};
}
function panTo(x, y){ // glide the view so a world point sits mid-screen

  const tx=innerWidth/2-x*view.s, ty=barTop/2-y*view.s, sx=view.x, sy=view.y, t0=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function step(){ const k=reduce?1:Math.min(1,(performance.now()-t0)/350), e=1-Math.pow(1-k,3);
    view.x=sx+(tx-sx)*e; view.y=sy+(ty-sy)*e; draw(); if(k<1) requestAnimationFrame(step); })();
}
$('reply').onclick = () => {
  if(!reveal) return; const pid=reveal.sq, P=squares.get(pid); reveal=null; $('reply').hidden=true;
  if(!P || pid.startsWith('_')) return;
  const id = claimAt(freeSpotNear(P), {exact:true, re:pid}); if(!id) return;
  mode='draw'; ui(); const q=squares.get(id); panTo(q.x, q.y);
  spillUntil = performance.now()+3500; spillRed=false; draw();   // show where to draw
};
function myAt(w, margin=0){ // your topmost creation under a point (margin lets a stroke start just outside the edge)
  let best=null;
  for(const id of mine){ const q=squares.get(id); if(!q) continue; const l=toLocal(q,w);
    if(l.x>=-margin && l.y>=-margin && l.x<=S+margin && l.y<=S+margin && (!best || q.z>squares.get(best).z)) best=id; }
  return best;
}
function flyTo(sq){
  const q = squares.get(sq); if(!q) return;
  const s = Math.min(2, Math.max(.5, Math.min(innerWidth, innerHeight-130)/(S*1.5)));
  view.s = s; view.x = innerWidth/2 - q.x*s; view.y = (innerHeight-60)/2 - q.y*s; draw();
}

function fitBubbles(){

  for(const b of bubbles){ x0=Math.min(x0,b.tx-b.R); y0=Math.min(y0,b.ty-b.R); x1=Math.max(x1,b.tx+b.R); y1=Math.max(y1,b.ty+b.R+30); }

// ---------- geometry ----------
const toWorld = (sx,sy)=>({x:(sx-view.x)/view.s, y:(sy-view.y)/view.s});
const toScreen = (wx,wy)=>({x:wx*view.s+view.x, y:wy*view.s+view.y});
function toLocal(q, w){ // world -> square's own 0..S coords
  const dx=w.x-q.x, dy=w.y-q.y, c=Math.cos(-q.r), s=Math.sin(-q.r);
  return {x: dx*c-dy*s + S/2, y: dx*s+dy*c + S/2};
}
function fromLocal(q, l){
  const dx=l.x-S/2, dy=l.y-S/2, c=Math.cos(q.r), s=Math.sin(q.r);
  return {x:q.x+dx*c-dy*s, y:q.y+dx*s+dy*c};
}
const inside = l => l.x>=0 && l.y>=0 && l.x<=S && l.y<=S;
const rotHandle = q => fromLocal(q, {x:S+18, y:-18});
function topSquareAt(w){
  let best=null;
  for(const [id,q] of squares){ if(inside(toLocal(q,w)) && (!best || q.z>best[1].z)) best=[id,q]; }
  return best;
}

// ---------- drawing ----------
let dpr=1, raf=0;
function resize(){ dpr=devicePixelRatio||1; cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr); draw(); }
function draw(){ if(!raf) raf=requestAnimationFrame(render); }
let localStroke = null, adminSel = null, spillUntil = 0, reveal = null, selBubble = null, maybe = null;
function topWithInkAt(w, skipMine){
  let best=null;
  for(const [id,q] of squares){ if(!q.items.length || (skipMine && mine.has(id))) continue; if(inside(toLocal(q,w)) && (!best || q.z>best[1].z)) best=[id,q]; }
  return best;
}
function inkBottom(q){ // lowest point of the drawing, in the square's own coords
  let x0=S, x1=0, y1=0;
  for(const m of q.items){
    if(m.t==='st'){ for(let i=0;i<m.pts.length;i+=2){ x0=Math.min(x0,m.pts[i]); x1=Math.max(x1,m.pts[i]); y1=Math.max(y1,m.pts[i+1]); } }
    else { const n=textLines(m).length; x0=Math.min(x0,m.x); x1=Math.max(x1,Math.min(S,m.x+widest(m.text,m.size))); y1=Math.max(y1,m.y+m.size*(1.25*n-.25)); }
  }
  return {x:Math.max(0,Math.min(S,(x0+x1)/2)), y:Math.min(S,y1)+14/view.s};
}
function paintReveal(){
  if(!reveal) return; const left = reveal.until - performance.now(), q = squares.get(reveal.sq);
  if(left<=0 || !q){ reveal=null; return; }
  const p = fromLocal(q, inkBottom(q));
  ctx.save(); ctx.globalAlpha = Math.min(1, left/500);
  ctx.fillStyle=col.muted; ctx.font=`${12/view.s}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign='center'; ctx.textBaseline='top';
  if(q.name) ctx.fillText(q.name, p.x, p.y); ctx.restore();
  const sp = toScreen(p.x, p.y), rb = $('reply');           // reply button just under the name
  rb.style.left = sp.x+'px'; rb.style.top = (sp.y + (q.name ? 22 : 4))+'px'; rb.style.opacity = Math.min(1, left/500);
  rb.hidden = false; draw();
}
function edgeAlpha(){ const left = spillUntil - performance.now(); if(left<=0) return 0; draw(); return Math.min(1, left/600); }
let spillRed = false;
function spill(red){ spillUntil = performance.now() + 1800; spillRed = !!red; draw(); }

let uiFont = null;
const fontFor = size => `${size}px ${uiFont || (uiFont = getComputedStyle(document.body).fontFamily)}`;
const isRtl = t => /^[^A-Za-z\u0590-\u05FF\u0600-\u06FF]*[\u0590-\u05FF\u0600-\u06FF]/.test(t);
function measure(text, size){ ctx.save(); ctx.font=fontFor(size); const w=ctx.measureText(text).width; ctx.restore(); return w; }
function textLines(m){ // wrap to the room left in the square, so nothing is cut at the edge
  if(m._lines) return m._lines;
  const size=m.size||20, max=Math.max(size*2, S-m.x), out=[], dirs=[];
  for(const para of m.text.split('\n')){
    const rtl=isRtl(para), start=out.length; let line='';
    for(const word of para.split(' ')){
      const next = line ? line+' '+word : word;
      if(measure(next,size)<=max){ line=next; continue; }
      if(line) out.push(line);
      line='';
      for(const ch of word){ if(measure(line+ch,size)>max && line){ out.push(line); line=ch; } else line+=ch; }
    }
    out.push(line);
    for(let i=start;i<out.length;i++) dirs.push(rtl);
  }
  m._dirs = dirs;
  return (m._lines = out);
}
function paintItems(q, over, extra){
  ctx.lineCap='round'; ctx.lineJoin='round';
  const list = !over && localStroke && q===squares.get(rs(localStroke.sq)) ? q.items.concat([localStroke]) : q.items;
  for(const m of list){
    const c = over || col['ink'+(m.ink|0)] || col.ink0;
    if(m.t==='st'){
      const p=m.pts; ctx.strokeStyle=c; ctx.fillStyle=c; ctx.lineWidth=(m.w||3)+(extra||0);
      if(p.length<=4){ ctx.beginPath(); ctx.arc(p[0],p[1],(m.w||3)/2,0,7); ctx.fill(); continue; }
      ctx.beginPath(); ctx.moveTo(p[0],p[1]);
      for(let i=2;i<p.length-2;i+=2) ctx.quadraticCurveTo(p[i],p[i+1],(p[i]+p[i+2])/2,(p[i+1]+p[i+3])/2);

    } else if(m.t==='tx'){
      ctx.fillStyle=c; ctx.font=fontFor(m.size||20); ctx.textBaseline='top'; ctx.textAlign='left';

      lines.forEach((ln,i)=>{ // Hebrew lines line up on the right, English on the left
        const rtl = m._dirs[i];

function paintSquare(id, q){
  ctx.save();
  ctx.translate(q.x,q.y); ctx.rotate(q.r); ctx.translate(-S/2,-S/2);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,S,S); ctx.clip(); paintItems(q);
  if(id===adminSel && adminItem){ const m=q.items.find(i=>i.id===adminItem); if(m) paintItems({items:[m]}, col.ink1, 4/view.s); }
  ctx.restore();
  const a = id===adminSel ? 1 : id===mySq ? (drag ? 1 : edgeAlpha()) : 0;
  if(a>0){
    ctx.globalAlpha=a; ctx.strokeStyle = id===adminSel || (id===mySq && spillRed && !drag) ? col.ink1 : col.mine; ctx.lineWidth=2/view.s; ctx.setLineDash([6/view.s,5/view.s]);
    ctx.strokeRect(0,0,S,S); ctx.setLineDash([]);
  }
  if(id===mySq && a>0){ // rotate handle
    ctx.fillStyle=col.paper; ctx.strokeStyle=col.mine; ctx.lineWidth=2/view.s;
    ctx.beginPath(); ctx.arc(S+18,-18,11/view.s,0,7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(S+18,-18,5/view.s,-2.5,1.6); ctx.stroke();

// network mode: one circle per square, area by views
let bubbles = [];
// Circle AREA is proportional to views: twice the views, twice the area.
// The most viewed gets R_MAX; a creation with no views yet is a small dot.
const R_MAX = 300, R_DOT = 16, GAP = 16;
function layoutBubbles(){
  const ids=[...squares.keys()].filter(id=>squares.get(id).items.length);   // only creations with something in them
  const max=Math.max(0,...ids.map(i=>counts[i]||0));
  const prev=new Map(bubbles.map(b=>[b.id,b]));
  bubbles = ids.map((id,i)=>{ const q=squares.get(id), n=counts[id]||0, p=prev.get(id);
    const R = max ? Math.max(R_DOT, R_MAX*Math.sqrt(n/max)) : 70;           // no views anywhere yet: all the same
    return {i, id, n, R, re:q.re, x:p?p.x:q.x, y:p?p.y:q.y, tx:p?p.tx:q.x, ty:p?p.ty:q.y, top: n>0 && n===max}; });
  // the layout works on targets (tx,ty); the circles then glide there
  const byId=new Map(bubbles.map(b=>[b.id,b])), links=bubbles.filter(b=>b.re && byId.has(b.re)).map(b=>[b, byId.get(b.re)]);
  // push overlapping circles apart; a grid keeps this fast with many circles
  const cell = 2*Math.max(70, ...bubbles.map(b=>b.R)) + GAP;
  const settled = bubbles.length && bubbles.every(b=>prev.has(b.id));   // later refreshes start from a finished layout
  for(let it=0, n=settled?40:200; it<n; it++){
    const grid=new Map(), key=(x,y)=>Math.floor(x/cell)+','+Math.floor(y/cell);
    for(const b of bubbles){ const k=key(b.tx,b.ty); (grid.get(k)||grid.set(k,[]).get(k)).push(b); }
    let moved=false;
    for(const [a,b] of links){ // a reply is pulled toward what it answers
      let dx=b.tx-a.tx, dy=b.ty-a.ty, d=Math.hypot(dx,dy)||.01; const want=a.R+b.R+GAP+120;   // leave room to see the link
      { const k=(d-want)/d*.25; dx*=k; dy*=k; a.tx+=dx; a.ty+=dy; b.tx-=dx; b.ty-=dy; if(Math.abs(d-want)>1) moved=true; }   // linked circles keep a set distance
    }
    for(const a of bubbles){
      const cx=Math.floor(a.tx/cell), cy=Math.floor(a.ty/cell);
      for(let gx=cx-1;gx<=cx+1;gx++) for(let gy=cy-1;gy<=cy+1;gy++) for(const b of grid.get(gx+','+gy)||[]){
        if(b.i<=a.i) continue;
        let dx=b.tx-a.tx, dy=b.ty-a.ty, d=Math.hypot(dx,dy)||.01; const m=a.R+b.R+GAP;
        if(d<m){ const k=(m-d)/2/d; dx*=k; dy*=k; a.tx-=dx; a.ty-=dy; b.tx+=dx; b.ty+=dy; moved=true; }
      }
    }
    if(!moved) break;
  }
}
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function paintBubbles(){
  ctx.textAlign='center'; ctx.textBaseline='top';
  const tl=toWorld(0,0), br=toWorld(innerWidth,innerHeight), still=reduceMotion();
  let moving=false;
  for(const b of bubbles){ // glide toward the layout
    if(still){ b.x=b.tx; b.y=b.ty; continue; }
    b.x+=(b.tx-b.x)*.12; b.y+=(b.ty-b.y)*.12; if(Math.abs(b.tx-b.x)+Math.abs(b.ty-b.y)>.5) moving=true;
  }
  // links between a reply and what it answers, with ink slowly flowing toward the original
  const byId=new Map(bubbles.map(b=>[b.id,b])), u=1/view.s; let anyLink=false;
  ctx.save(); ctx.strokeStyle=col.muted; ctx.lineWidth=1.5*u; ctx.setLineDash([6*u,6*u]);
  ctx.lineDashOffset = still ? 0 : -(performance.now()/60)%12*u;
  for(const b of bubbles){ const a=b.re && byId.get(b.re); if(!a) continue; anyLink=true;
    const dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy)||1;
    ctx.beginPath(); ctx.moveTo(b.x+dx/d*b.R, b.y+dy/d*b.R); ctx.lineTo(a.x-dx/d*a.R, a.y-dy/d*a.R); ctx.stroke(); }
  ctx.restore();
  if(moving || (anyLink && !still)) draw();
  for(const b of bubbles){
    const q=squares.get(b.id); if(!q) continue;
    if(b.x+b.R<tl.x || b.x-b.R>br.x || b.y+b.R<tl.y || b.y-b.R-40>br.y) continue;   // off screen
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.beginPath(); ctx.arc(0,0,b.R,0,7); ctx.fillStyle=col.paper; ctx.fill();
    ctx.save(); ctx.clip(); const k=(2*b.R)/S*1.05; ctx.scale(k,k); ctx.translate(-S/2,-S/2); paintItems(q); ctx.restore();
    ctx.lineWidth=(b.top?3:1)/view.s; ctx.strokeStyle=b.top?col.mine:col.edge; ctx.beginPath(); ctx.arc(0,0,b.R,0,7); ctx.stroke();
    ctx.fillStyle=col.muted; ctx.font=`${12/view.s}px ${getComputedStyle(document.body).fontFamily}`;
    const u=1/view.s, ey=b.R+13*u; ctx.strokeStyle=col.muted; ctx.lineWidth=1.5*u;
    ctx.beginPath(); ctx.ellipse(-12*u,ey,8*u,4.5*u,0,0,7); ctx.stroke(); ctx.beginPath(); ctx.arc(-12*u,ey,1.8*u,0,7); ctx.fill();
    ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(String(b.n), 0, ey); ctx.textAlign='center'; ctx.textBaseline='top';
    if(selBubble===b.id && q.name) ctx.fillText(q.name, 0, ey+12*u);
    ctx.restore();
  }
}

function render(){
  raf=0;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=col.desk; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);
  if(net){ paintBubbles(); }
  else{
    const tl=toWorld(0,0), br=toWorld(innerWidth,innerHeight), pad=S;
    [...squares].sort((a,b)=>a[1].z-b[1].z).forEach(([id,q])=>{
      if(q.x<tl.x-pad||q.x>br.x+pad||q.y<tl.y-pad||q.y>br.y+pad) return;
      paintSquare(id,q);
    });
    paintReveal();
  }
  if(net || !reveal) $('reply').hidden = true;
  $('hint').hidden = squares.size>0 || day===null;
}

// ---------- input ----------
const ptrs=new Map(); let pinch=null, pan=null, drag=null, tap=null;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ localStroke=null; pan=drag=maybe=null; const p=pp(); pinch={...p, v:{...view}}; draw(); return; }
  if(ptrs.size>2) return;
  const w=toWorld(e.clientX,e.clientY);
  tap={x:e.clientX,y:e.clientY};
  if(net){ pan={x:e.clientX,y:e.clientY}; return; }
  if(!$('namebox').hidden && document.activeElement!==$('name')) closeName();
  if(!$('tp').hidden){ ptrs.delete(e.pointerId); tap=null; return; }
  if(adminOn()){ pan={x:e.clientX,y:e.clientY}; cv.classList.add('grabbing'); return; }
  if(mode==='draw' && !myAt(w,24) && topWithInkAt(w,true)){ // a tap on someone's drawing shows their name; a drag still draws
    maybe={w, x:e.clientX, y:e.clientY}; return; }
  startAt(e, w);
});
function startAt(e, w){
  if(mySq) mySq = rs(mySq);
  const act = mySq && squares.get(mySq);
  if(act && edgeAlpha()>0){ // rotate handle of the creation whose outline is showing
    const h=toScreen(...Object.values(rotHandle(act)));
    if(Math.hypot(h.x-e.clientX,h.y-e.clientY)<22){ drag={kind:'rot', sq:mySq, a0:Math.atan2(w.y-act.y,w.x-act.x)-act.r}; return; }
  }
  if(mode==='move'){
    const id=myAt(w);
    if(id){ const q=squares.get(id); mySq=id; ui(); drag={kind:'move', sq:id, dx:w.x-q.x, dy:w.y-q.y}; cv.classList.add('grabbing'); return; }
  } else if(mode==='draw'){
    let id = myAt(w,24);                  // inside (or just at the edge of) one of yours: keep drawing there
    if(!id && day) id = claimAt(w);       // anywhere else: a new creation right here
    if(id){ const q=squares.get(id), l=toLocal(q,w); mySq=id; ui(); if(!inside(l)) spill();
      localStroke={t:'st',id:rid(),sq:id,ink,w:Math.max(1.5,Math.min(8,3/view.s)),pts:[r1(cl(l.x)),r1(cl(l.y))]}; draw(); return; }
  } else if(mode==='text'){
    e.preventDefault?.();
    const id = myAt(w);
    if(id){ const q=squares.get(id), l=toLocal(q,w), hit=textAt(q,l); mySq=id; ui();
      openPanel(hit ? {x:hit.x,y:hit.y,size:20} : {x:l.x,y:l.y,size:20}, hit, id); return; }
    if(day){ openPanel(null, null, null, w); return; }   // the creation is made only when the text is saved
  }
  pan={x:e.clientX,y:e.clientY}; cv.classList.add('grabbing');
}
const r1=n=>Math.round(n*10)/10, cl=n=>Math.max(-20,Math.min(S+20,n));
cv.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){ const p=pp(), s=Math.min(6,Math.max(.08,pinch.v.s*p.d/pinch.d)), k=s/pinch.v.s;
    view={s, x:p.mx-(pinch.mx-pinch.v.x)*k, y:p.my-(pinch.my-pinch.v.y)*k}; draw(); return; }
  if(maybe){
    if(Math.hypot(e.clientX-maybe.x,e.clientY-maybe.y)<6) return;
    const m=maybe; maybe=null; startAt({clientX:m.x, clientY:m.y}, m.w);
  }
  const w=toWorld(e.clientX,e.clientY);
  let q = drag ? squares.get(rs(drag.sq)) : localStroke ? squares.get(rs(localStroke.sq)) : null;
  if(drag && q){
    if(drag.kind==='move'){ q.x=w.x-drag.dx; q.y=w.y-drag.dy; }
    else q.r=Math.atan2(w.y-q.y,w.x-q.x)-drag.a0;
    q.z=Number.MAX_SAFE_INTEGER; draw(); return;
  }
  if(localStroke && q){ const l=toLocal(q,w), p=localStroke.pts;
    if(!inside(l)) spill();
    if(Math.hypot(l.x-p[p.length-2],l.y-p[p.length-1])>1.5/view.s && p.length<2998){ p.push(r1(Math.max(-20,Math.min(S+20,l.x))), r1(Math.max(-20,Math.min(S+20,l.y)))); draw(); } return; }
  if(pan){ view.x+=e.clientX-pan.x; view.y+=e.clientY-pan.y; pan={x:e.clientX,y:e.clientY}; draw(); }
});
function end(e){
  ptrs.delete(e.pointerId); cv.classList.remove('grabbing');
  if(pinch){ if(ptrs.size<2) pinch=null; return; }
  const wasTap = tap && Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<6; tap=null;
  if(adminOn() && !net){ pan=null; if(wasTap) adminPick(toWorld(e.clientX,e.clientY)); return; }
  if(maybe){ const t=topWithInkAt(maybe.w,true); maybe=null; if(t){ reveal={sq:t[0], until:performance.now()+6000}; draw(); return; } }
  if(drag){ const sq=rs(drag.sq), q=squares.get(sq); drag=null; spill(); if(q){ pendingMove++; send({t:'sq',x:q.x,y:q.y,r:q.r}, sq).finally(()=>pendingMove--); } return; }
  if(localStroke){ const {sq:sq0, ...st}=localStroke, sq=rs(sq0), q=squares.get(sq); localStroke=null;
    if(q){ q.items.push(st); q.z=Number.MAX_SAFE_INTEGER; ui(); draw();
      send(st, sq).catch(()=>{ q.items=q.items.filter(i=>i!==st); draw(); ui(); }); }
    return; }
  pan=null;
  if(wasTap && net){ const w=toWorld(e.clientX,e.clientY); const b=bubbles.find(b=>Math.hypot(b.x-w.x,b.y-w.y)<Math.max(b.R, 22/view.s));
    if(b && selBubble===b.id){ net=false; selBubble=null; ui(); flyTo(b.id); }
    else { selBubble = b ? b.id : null; draw(); } }
  else if(wasTap && mode==='move'){ const t=topWithInkAt(toWorld(e.clientX,e.clientY),false); if(t){ reveal={sq:t[0], until:performance.now()+6000}; draw(); } }
}
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', e=>{ ptrs.delete(e.pointerId); pinch=pan=maybe=null; localStroke=null; if(drag){drag=null;} draw(); });
function pp(){ const [a,b]=[...ptrs.values()]; return {mx:(a.x+b.x)/2,my:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)||1}; }
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey||(!e.deltaX&&Math.abs(e.deltaY)>=40)){
    const s=Math.min(6,Math.max(.08,view.s*Math.exp(-e.deltaY*.0015))), k=s/view.s;
    view={s, x:e.clientX-(e.clientX-view.x)*k, y:e.clientY-(e.clientY-view.y)*k};
  } else { view.x-=e.deltaX; view.y-=e.deltaY; }
  draw();
},{passive:false});

// text: a small panel for writing and editing
const tpa=$('tpa'); let tp=null;
const MIN_TEXT = 11, MAX_CHARS = 600;
const widest = (t,size) => Math.max(0, ...t.split('\n').map(ln=>measure(ln,size)));
// Fit text inside the square: keep its spot if it fits, else move it in,
// then use the full width, then shrink the letters. over = it still does not fit.
function fitText(t, at){
  const height = (size, x) => { const n=textLines({text:t,size,x}).length; return size*(1.25*n-.25); };
  let x=Math.max(0,Math.min(S,at.x)), size=at.size;
  const w=widest(t,size); if(x+w>S) x=Math.max(0,S-w); x=Math.round(x);
  let h=height(size,x);
  if(h>S && x>0){ x=0; h=height(size,0); }
  while(h>S && size>MIN_TEXT){ size--; h=height(size,0); x=0; }
  return {x, y:Math.round(Math.max(0,Math.min(at.y,S-h))), size, over: h>S};
}
function textAt(q, l){ // own text under a tap, if any
  for(let i=q.items.length-1;i>=0;i--){ const m=q.items[i]; if(m.t!=='tx') continue;
    const n=textLines(m).length, w=Math.min(S-m.x, widest(m.text,m.size)), h=m.size*1.25*n;
    if(l.x>=m.x-6 && l.x<=m.x+w+6 && l.y>=m.y-6 && l.y<=m.y+h+6) return m; }
  return null;
}
function openPanel(at, edit, sq, w){ // sq: the creation it goes in; none yet = make one at w on save
  closeName();
  tp={at: at || {x:S/2-60, y:S/2-10, size:20}, edit, sq, w, ink: edit ? edit.ink : ink};
  tpa.value = edit ? edit.text : ''; tpa.style.color = col['ink'+tp.ink];
  $('tpdel').hidden = !edit; $('tp').hidden = false; tpInput(); tpa.focus();
}
function closePanel(){ tp=null; $('tp').hidden=true; $('tp').classList.remove('over'); tpa.blur(); }
function tpInput(){
  if(!tp) return; const t=tpa.value.trim();
  $('tpc').textContent = `${tpa.value.length}/${MAX_CHARS}`;
  const over = (t ? fitText(t,tp.at).over : false) || tpa.value.length>=MAX_CHARS;
  $('tp').classList.toggle('over', over); if(over) spill(true);
}
function savePanel(){
  if(!tp) return; let {at,edit,sq,w,ink:k}=tp; let t=tpa.value.trim().replace(/\n{3,}/g,'\n\n');
  closePanel(); if(!t && !edit) return;
  if(!sq){ sq = claimAt(w); if(!sq) return; const l=toLocal(squares.get(sq), w); at={x:l.x, y:l.y, size:20}; }
  sq=rs(sq); const q=squares.get(sq); if(!q) return; mySq=sq;
  if(!t){ if(edit) removeText(q, edit, sq); return; }
  let f=fitText(t, at);
  while(f.over && t.length>1){ t=t.slice(0,-1); f=fitText(t,at); }
  if(edit){
    const before={...edit}; Object.assign(edit,{size:f.size,x:f.x,y:f.y,text:t}); delete edit._lines; delete edit._bw; draw();
    send({t:'te',id:edit.id,ink:edit.ink,size:f.size,x:f.x,y:f.y,text:t}, sq).catch(()=>{ Object.assign(edit,before); delete edit._lines; delete edit._bw; draw(); });
  } else {
    const it={t:'tx',id:rid(),ink:k,size:f.size,x:f.x,y:f.y,text:t};
    q.items.push(it); ui(); draw(); send(it, sq).catch(()=>{ q.items=q.items.filter(i=>i!==it); draw(); ui(); });
  }
}
function removeText(q, it, sq){
  q.items=q.items.filter(i=>i!==it); ui(); draw();
  send({t:'un', id: it.id}, sq).catch(()=>{ q.items.push(it); draw(); ui(); });
}
tpa.addEventListener('input', tpInput);
tpa.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) savePanel(); });
$('tpok').onclick = savePanel;
$('tpx').onclick = closePanel;
$('tpdel').onclick = () => { if(!tp||!tp.edit) return; const sq=rs(tp.sq), q=squares.get(sq), it=tp.edit; closePanel(); if(q) removeText(q,it,sq); };

// ---------- views ----------
const seenTime = {}; let queue = [];
function seenKey(){ return 'bp-seen-'+day; }
function reported(){ try{ return new Set(JSON.parse(store.get(seenKey())||'[]')); }catch{ return new Set(); } }
setInterval(()=>{
  if(document.hidden || net || !day) return;
  const done = reported();
  for(const [id,q] of squares){
    if(mine.has(id) || done.has(id) || queue.includes(id) || !q.items.length) continue;   // empty creations are not views
    const p=toScreen(q.x,q.y), big=S*view.s>=90;
    if(big && p.x>0 && p.y>0 && p.x<innerWidth && p.y<innerHeight){ if((seenTime[id]=(seenTime[id]||0)+1)>=2) queue.push(id); }
    else seenTime[id]=0;
  }
}, 1000);
setInterval(async ()=>{
  if(!queue.length) return;
  const batch=queue.splice(0,40);
  try{ await post('/api/view',{sqs:batch}); const d=reported(); batch.forEach(b=>d.add(b)); store.set(seenKey(), JSON.stringify([...d])); }
  catch{ queue.unshift(...batch); }
}, 4000);
async function loadCounts(){
  try{ const r=await fetch('/api/views',{cache:'no-store'}); const d=await r.json(); if(d.day===day) counts=d.counts||{}; }catch{}
  layoutBubbles(); draw();
}
setInterval(()=>{ if(net && !document.hidden) loadCounts(); }, 6000);

// ---------- admin (#admin) ----------
const admin = location.hash==='#admin' || location.pathname.replace(/\/$/,'')==='/admin';
let adminSession = null, adminItem = null;
try{ adminSession = sessionStorage.getItem('bp-admin'); }catch{}
const adminOn = () => admin && !!adminSession;
let adminMethods = {google:false, password:false};
function adminUi(){
  $('admin').hidden = !admin;
  $('atools').hidden = !adminOn(); $('gbtn').hidden = adminOn() || !adminMethods.google; $('apw').hidden = adminOn() || !adminMethods.password;
  $('adel').disabled = !adminSel; $('aitem').disabled = !adminItem;
}
async function adminLogin(credential, password){
  try{
    const r = await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(password!=null ? {password} : {credential})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ note(r.status===403 ? (password!=null ? 'סיסמה שגויה' : 'החשבון הזה אינו מנהל') : r.status===429 ? 'יותר מדי ניסיונות. נסה שוב בעוד כמה דקות.' : 'הכניסה נכשלה'); return; }
    $('apwi').value='';
    adminSession = d.session; try{ sessionStorage.setItem('bp-admin', adminSession); }catch{}
    note(''); adminUi(); draw();
  }catch{ note('הכניסה נכשלה'); }
}
function adminLogout(){ adminSession=null; adminSel=null; adminItem=null; try{ sessionStorage.removeItem('bp-admin'); }catch{} adminUi(); draw(); }
function adminPick(w){
  const t = topWithInkAt(w,false) || topSquareAt(w);
  adminSel = t ? t[0] : null; adminItem = null;
  if(t){
    const q=t[1], l=toLocal(q,w), tol=16/view.s; let best=tol;
    for(const m of q.items){
      let d=Infinity;
      if(m.t==='st'){ for(let i=0;i<m.pts.length;i+=2) d=Math.min(d, Math.hypot(m.pts[i]-l.x, m.pts[i+1]-l.y)); }
      else if(l.x>=m.x-4 && l.x<=m.x+m.text.length*m.size*.6 && l.y>=m.y-4 && l.y<=m.y+m.size+4) d=0;
      if(d<best){ best=d; adminItem=m.id; }
    }
    reveal = {sq:t[0], until:performance.now()+6000};
  }
  adminUi(); draw();
}
async function adminDelete(withItem){
  if(!adminSel) return;
  try{
    const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session:adminSession, sq:adminSel, id: withItem ? adminItem : undefined})});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){ adminLogout(); note('צריך להתחבר שוב'); return; }
    if(!r.ok){ note('המחיקה נכשלה'); return; }
    apply(d.ev); adminItem=null; if(!withItem) adminSel=null; adminUi(); draw();
  }catch{ note('המחיקה נכשלה'); }
}
if(admin){
  $('adel').onclick = () => adminDelete(false);
  $('aitem').onclick = () => adminDelete(true);
  $('aout').onclick = adminLogout;
  if(location.hostname==='localhost') window.bpAdminLogin = adminLogin;
  $('apw').addEventListener('submit', e=>{ e.preventDefault(); const v=$('apwi').value; if(v) adminLogin(null, v); });
  fetch('/api/config').then(r=>r.json()).then(c=>{
    adminMethods = {google: !!c.googleClientId, password: !!c.password}; adminUi();
    if(!adminOn() && adminMethods.password) $('apwi').focus();
    if(!c.googleClientId){ if(!adminOn() && !c.password) note('כניסת מנהל עוד לא הוגדרה'); return; }
    const g=document.createElement('script'); g.src='https://accounts.google.com/gsi/client'; g.async=true;
    g.onload=()=>{ google.accounts.id.initialize({client_id:c.googleClientId, callback:r=>adminLogin(r.credential)});
      google.accounts.id.renderButton($('gbtn'),{type:'icon',shape:'circle',theme:'outline',size:'medium'}); };
    document.head.appendChild(g);
  }).catch(()=>{});
  adminUi();
}

if(location.hostname==='localhost') window.__bp = { squares, mine, get bubbles(){ return bubbles; }, layoutBubbles, counts:()=>counts, get mySq(){ return mySq; }, myAt, toWorld, get view(){ return view; } };
// ---------- clock ----------
function tick(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value, left=86400-((g('hour')%24)*3600+g('minute')*60+g('second'));
  const f=n=>String(n).padStart(2,'0');
  $('clockt').textContent=`${f(Math.floor(left/3600))}:${f(Math.floor(left%3600/60))}:${f(left%60)}`;
}

// ---------- boot ----------
addEventListener('resize', resize);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
readColors(); resize(); tick(); setInterval(tick,1000);
poll().then(()=>{ ui(); });
setInterval(poll, 1500);
ui();
})();
</script>
