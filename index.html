<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>דף ריק</title>
<meta name="description" content="דף משותף. כל אחד מקבל ריבוע. בחצות הכול נמחק.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap">
<style>
/* Layout: a desk of loose paper squares, one thin toolbar at the bottom, a clock in the corner. */
:root{
  --desk:#e7e8ea; --paper:#ffffff; --edge:rgba(0,0,0,.10); --fg:#1b1b1a; --muted:#7d7f84; --bar:#ffffff; --line:#dcdde0; --mine:#1f5fd1;
  --ink0:#1b1b1a; --ink1:#d23a2a; --ink2:#1f5fd1; --ink3:#1f8a4c; --ink4:#e0a100;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --desk:#0e0f11; --paper:#1d1e21; --edge:rgba(255,255,255,.08); --fg:#ececea; --muted:#83868c; --bar:#1d1e21; --line:#2e3034; --mine:#6b9dff;
  --ink0:#ececea; --ink1:#ff6a55; --ink2:#6b9dff; --ink3:#4fcf86; --ink4:#ffcc33; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--fg);font:14px/1.4 var(--ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c.draw{cursor:crosshair} #c.text{cursor:text} #c.grabbing{cursor:grabbing}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tools{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:5px 6px;max-width:100%}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
button{font:inherit;color:var(--fg);background:none;border:0;border-radius:8px;padding:6px 10px;min-height:34px;cursor:pointer}
button:hover{background:var(--line)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bar)}
button:focus-visible{outline:2px solid var(--mine);outline-offset:2px}
button:disabled{opacity:.35;cursor:default;background:none}
button.icon{display:grid;place-items:center;padding:6px;min-width:36px}
button.primary{background:var(--mine);color:#fff}
.dot{width:24px;height:24px;min-height:0;padding:3px;border-radius:50%;border:2px solid transparent}
.dot i{display:block;width:100%;height:100%;border-radius:50%;background:var(--c)}
.dot[aria-pressed="true"]{background:none;border-color:var(--fg)}
#inks{display:flex;gap:2px}
.corner{position:fixed;top:calc(12px + env(safe-area-inset-top));color:var(--muted);font-size:12px;pointer-events:none;font-variant-numeric:tabular-nums}
#clock{right:max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:5px}
#note{left:max(16px,env(safe-area-inset-left));max-width:55vw;text-align:left}
#hint{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);opacity:.6;pointer-events:none}
#ti{position:fixed;background:transparent;border:0;border-bottom:1px dashed var(--muted);outline:none;font-family:var(--ui);padding:0;min-width:140px;text-align:left;direction:auto}
#namebox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px;color:var(--muted);max-width:calc(100% - 32px)}
#namebox input{font:inherit;font-size:15px;width:12em;max-width:52vw;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--fg);text-align:center;direction:auto}
#admin{display:flex;gap:4px;align-items:center}
#gbtn{display:grid;place-items:center;min-width:36px;min-height:34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="הדף המשותף"></canvas>
<div id="hint" hidden aria-label="גע כדי לכתוב"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4.5L16 4.5a2.1 2.1 0 013 3L8 18.5 4 20z"/><path d="M14 6.5l3.5 3.5"/></svg></div>
<div id="clock" class="corner" dir="ltr" title="הדף נמחק בחצות"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10M7 21h10"/><path d="M8 3c0 4 8 5 8 9s-8 5-8 9M16 3c0 4-8 5-8 9"/><path d="M16 21c0-4-8-5-8-9"/></svg><span id="clockt"></span></div>
<div id="note" class="corner" dir="rtl"></div>
<div id="namebox" hidden dir="rtl"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><input id="name" maxlength="24" autocomplete="nickname" aria-label="השם שלי"><button id="nameok" class="icon" aria-label="שמור" title="שמור"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
<input id="ti" hidden maxlength="200" autocomplete="off" aria-label="טקסט">

<div id="bar"><div class="tools" role="toolbar">
  <button id="m-draw" class="icon" aria-pressed="true" aria-label="עט" title="עט"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4.5L16 4.5a2.1 2.1 0 013 3L8 18.5 4 20z"/><path d="M14 6.5l3.5 3.5"/></svg></button>
  <button id="m-text" class="icon" aria-pressed="false" aria-label="טקסט" title="טקסט"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6.5V5h14v1.5"/><path d="M12 5v14"/><path d="M9.5 19h5"/></svg></button>
  <button id="m-move" class="icon" aria-pressed="false" aria-label="הזזה" title="הזזה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18"/><path d="M9.5 5.5L12 3l2.5 2.5M9.5 18.5L12 21l2.5-2.5M5.5 9.5L3 12l2.5 2.5M18.5 9.5L21 12l-2.5 2.5"/></svg></button>
  <span class="sep"></span>
  <span id="inks"></span>
  <button id="undo" class="mineonly icon" hidden disabled aria-label="מחק את האחרון" title="מחק את האחרון"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 12.5h9l1-12.5"/><path d="M10 11v5M14 11v5"/></svg></button>
  <span class="sep"></span>
  <button id="me" class="icon" aria-label="השם שלי" title="השם שלי" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></button>
  <button id="net" class="icon" aria-pressed="false" aria-label="רשת" title="רשת"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="10" r="5.5"/><circle cx="17.5" cy="16.5" r="3"/><circle cx="17" cy="5.5" r="2"/></svg></button>
  <span id="admin" hidden><span class="sep"></span><span id="gbtn" title="כניסת מנהל"></span><span id="atools" hidden style="display:contents"><span id="ashield" class="icon" title="מצב מנהל" style="color:var(--ink1);display:grid;place-items:center;padding:0 4px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/></svg></span><button id="aitem" class="icon" disabled aria-label="מחק קו" title="מחק קו"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 20H20"/><path d="M4.6 14.6l8.9-8.9a2 2 0 012.8 0l2.5 2.5a2 2 0 010 2.8L11 19.8a1 1 0 01-.7.2H7.9a1 1 0 01-.7-.3l-2.6-2.6a1.8 1.8 0 010-2.5z"/><path d="M9.5 9.7l5 5"/></svg></button><button id="adel" class="icon" disabled aria-label="מחק ציור" title="מחק ציור"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg></button><button id="aout" class="icon" aria-label="יציאה" title="יציאה"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></button></span></span>
</div></div>

<script>
(() => {
'use strict';
const S = 360;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const note = t => { $('note').textContent = t || ''; };

// ---------- identity (per browser) ----------
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} },
};
let token = store.get('bp-token');
if(!token){ const a=new Uint8Array(18); crypto.getRandomValues(a); token=btoa(String.fromCharCode(...a)).replace(/[+/=]/g,c=>({'+':'-','/':'_','=':''}[c])); store.set('bp-token',token); }
const rid = () => Math.random().toString(36).slice(2,10);
const pick = a => a[Math.floor(Math.random()*a.length)];
const randomName = () => pick(['ינשוף','שועל','דולפין','צב','קיפוד','זברה','נמר','לוטרה','פינגווין','תמנון','סנאי','לוויתן'])+' '+
  pick(['שקט','כחול','ישנוני','מהיר','סקרן','עליז','רגוע','נועז','ביישן','חולמני','זריז','מנומס']);
let myName = store.get('bp-name');
if(!myName){ myName = randomName(); store.set('bp-name', myName); }

// ---------- state ----------
let day = null, lastV = 0;
const applied = new Set();
const squares = new Map();          // sq -> {x,y,r,z,items:[]}
let mySq = null, mode = 'draw', ink = 0, net = false;
let view = {x: innerWidth/2, y: innerHeight/2.3, s: Math.min(1, innerWidth/(S*1.4))};
let counts = {};
let pendingMove = 0;

// ---------- colors ----------
let col = {};
function readColors(){
  const st = getComputedStyle(document.documentElement);
  for(const n of ['desk','paper','edge','fg','muted','mine','ink0','ink1','ink2','ink3','ink4']) col[n]=st.getPropertyValue('--'+n).trim();
  draw();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

// ---------- events from server ----------
function apply(e){
  if(applied.has(e.v)) return; applied.add(e.v);
  if(e.t==='sq'){
    let q = squares.get(e.sq);
    if(!q){ q={x:e.x,y:e.y,r:e.r,z:e.z,items:[]}; squares.set(e.sq,q); }
    if(e.name) q.name = e.name;
    else if(!(e.sq===mySq && (pendingMove>0 || drag))){ q.x=e.x; q.y=e.y; q.r=e.r; }
    q.z = Math.max(q.z, e.z);
  } else if(e.t==='del'){
    squares.delete(e.sq);
    if(e.sq===mySq){ mySq=null; ui(); note('הריבוע שלך הוסר.'); }
    if(e.sq===adminSel){ adminSel=null; adminItem=null; if(admin) adminUi(); }
  } else {
    const q = squares.get(e.sq); if(!q) return;
    if(e.t==='un'){ q.items = q.items.filter(i=>i.id!==e.id); return; }
    if(e.t==='nm'){ q.name = e.name; return; }
    if(!q.items.some(i=>i.id===e.id)) q.items.push(e);
    q.z = Math.max(q.z, e.v);
  }
}

let polling = false, failures = 0;
async function poll(){
  if(polling || document.hidden) return; polling = true;
  try{
    const r = await fetch(`/api/events?day=${day||''}&since=${Math.max(0,lastV-30)}`, {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    if(d.reset && d.day!==day){
      squares.clear(); applied.clear(); lastV=0; counts={};
      day = d.day; mySq = store.get('bp-sq-'+day); ui();
    }
    for(const e of d.events){ apply(e); lastV=Math.max(lastV,e.v); }
    lastV = Math.max(lastV, d.v);
    failures = 0; if($('note').dataset.err) { note(''); delete $('note').dataset.err; }
    draw();
  }catch{
    if(++failures===3){ note('אין חיבור לשרת. מנסה שוב…'); $('note').dataset.err=1; }
  }finally{ polling=false; }
}

async function post(path, payload){
  const r = await fetch(path, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({token, day, ...payload})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===429) note('לאט לאט. נסו שוב בעוד דקה.');
    else if(r.status===507) note('הדף מלא להיום. בחצות הוא מתרוקן.');
    else if(r.status===403){ note('הריבוע הזה כבר לא שלך.'); }
    else if(r.status===409) poll();
    throw d;
  }
  return d;
}

async function send(ev){
  if(claimP) await claimP;
  if(!mySq || mySq==='_new') throw 0;
  return post('/api/act', {sq: mySq, ev}).then(d=>{ apply(d.ev); const q=squares.get(mySq); if(q) q.z=d.ev.v; lastV=Math.max(lastV,d.ev.v); draw(); return d; });
}

// ---------- claiming ----------
let claimP = null;
function claimAt(w){ // square centered where the person first touched; drawing starts at once
  const tmp = {x:Math.round(w.x), y:Math.round(w.y), r:0, z:Number.MAX_SAFE_INTEGER, items:[], name:myName};
  squares.set('_new', tmp); mySq = '_new'; ui();
  claimP = post('/api/claim', {x:tmp.x, y:tmp.y, name:myName}).then(d=>{
    squares.delete('_new');
    const known = squares.get(d.sq);
    if(known){ known.items.push(...tmp.items); } else squares.set(d.sq, tmp);
    day = d.day; mySq = d.sq; store.set('bp-sq-'+day, mySq);
    if(d.ev){ apply(d.ev); setTimeout(()=>openName(true), 900); }
    ui(); draw();
  }).catch(e=>{ squares.delete('_new'); mySq=null; ui(); draw(); throw e; }).finally(()=>{ claimP=null; });
  return tmp;
}
function flyTo(sq){
  const q = squares.get(sq); if(!q) return;
  const s = Math.min(2, Math.max(.5, Math.min(innerWidth, innerHeight-130)/(S*1.5)));
  view.s = s; view.x = innerWidth/2 - q.x*s; view.y = (innerHeight-60)/2 - q.y*s; draw();
}

// ---------- toolbar ----------
for(let i=0;i<5;i++){
  const b=document.createElement('button'); b.className='dot'; b.innerHTML=`<i style="--c:var(--ink${i})"></i>`;
  b.setAttribute('aria-label','צבע '+(i+1)); b.setAttribute('aria-pressed', i===0);
  b.onclick=()=>{ ink=i; [...$('inks').children].forEach((d,j)=>d.setAttribute('aria-pressed', j===i)); };
  $('inks').appendChild(b);
}
for(const m of ['draw','text','move']) $('m-'+m).onclick = () => { commitText(); mode=m; ui(); };
$('net').onclick = async () => { commitText(); net=!net; ui(); if(net){ await loadCounts(); fitBubbles(); } draw(); };
function fitBubbles(){
  if(!bubbles.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const b of bubbles){ x0=Math.min(x0,b.x-b.R); y0=Math.min(y0,b.y-b.R); x1=Math.max(x1,b.x+b.R); y1=Math.max(y1,b.y+b.R+30); }
  const s=Math.min(2, Math.max(.05, Math.min(innerWidth*.9/(x1-x0), (innerHeight-140)/(y1-y0))));
  view={s, x:innerWidth/2-(x0+x1)/2*s, y:(innerHeight-70)/2-(y0+y1)/2*s};
}
$('undo').onclick = () => {
  const q = squares.get(mySq); if(!q||!q.items.length) return;
  const it = q.items.pop(); draw(); ui();
  send({t:'un', id: it.id}).catch(()=>{ q.items.push(it); draw(); });
};
function ui(){
  const has = !!mySq;
  for(const m of ['draw','text','move']){ $('m-'+m).hidden=net; $('m-'+m).setAttribute('aria-pressed', mode===m); }
  $('inks').hidden = net; $('me').hidden = net; if(net) closeName(); document.querySelectorAll('.sep').forEach(e=>e.hidden=net); document.querySelectorAll('.mineonly').forEach(e=>e.hidden=!has||net);
  const q = squares.get(mySq); $('undo').disabled = !q || !q.items.length;
  $('net').setAttribute('aria-pressed', net);
  cv.className = net ? '' : mode==='draw' ? 'draw' : mode==='text' ? 'text' : '';
}

// ---------- name ----------
let nameTimer = 0;
function openName(offer){
  if(net) return;
  $('name').value = myName; $('namebox').hidden = false; $('me').setAttribute('aria-pressed', true);
  clearTimeout(nameTimer);
  if(offer) nameTimer = setTimeout(()=>{ if(document.activeElement!==$('name')) closeName(); }, 6000);
  else $('name').focus();
}
function closeName(){ $('namebox').hidden = true; $('me').setAttribute('aria-pressed', false); clearTimeout(nameTimer); }
function saveName(){
  const n = $('name').value.replace(/\s+/g,' ').trim().slice(0,24) || myName;
  closeName();
  if(n===myName) return;
  myName = n; store.set('bp-name', n);
  const q = squares.get(mySq); if(q) q.name = n;
  if(mySq && mySq!=='_new') send({t:'nm', name:n}).catch(()=>{});
  draw();
}
$('me').onclick = () => $('namebox').hidden ? openName(false) : closeName();
$('nameok').onclick = saveName;
$('name').addEventListener('keydown', e=>{ if(e.key==='Enter') saveName(); if(e.key==='Escape') closeName(); });
$('name').addEventListener('focus', ()=>clearTimeout(nameTimer));

// ---------- geometry ----------
const toWorld = (sx,sy)=>({x:(sx-view.x)/view.s, y:(sy-view.y)/view.s});
const toScreen = (wx,wy)=>({x:wx*view.s+view.x, y:wy*view.s+view.y});
function toLocal(q, w){ // world -> square's own 0..S coords
  const dx=w.x-q.x, dy=w.y-q.y, c=Math.cos(-q.r), s=Math.sin(-q.r);
  return {x: dx*c-dy*s + S/2, y: dx*s+dy*c + S/2};
}
function fromLocal(q, l){
  const dx=l.x-S/2, dy=l.y-S/2, c=Math.cos(q.r), s=Math.sin(q.r);
  return {x:q.x+dx*c-dy*s, y:q.y+dx*s+dy*c};
}
const inside = l => l.x>=0 && l.y>=0 && l.x<=S && l.y<=S;
const rotHandle = q => fromLocal(q, {x:S+18, y:-18});
function topSquareAt(w){
  let best=null;
  for(const [id,q] of squares){ if(inside(toLocal(q,w)) && (!best || q.z>best[1].z)) best=[id,q]; }
  return best;
}

// ---------- drawing ----------
let dpr=1, raf=0;
function resize(){ dpr=devicePixelRatio||1; cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr); draw(); }
function draw(){ if(!raf) raf=requestAnimationFrame(render); }
let localStroke = null, adminSel = null, spillUntil = 0, reveal = null, selBubble = null, maybe = null;
function topWithInkAt(w, skipMine){
  let best=null;
  for(const [id,q] of squares){ if(!q.items.length || (skipMine && id===mySq)) continue; if(inside(toLocal(q,w)) && (!best || q.z>best[1].z)) best=[id,q]; }
  return best;
}
function inkBottom(q){ // lowest point of the drawing, in the square's own coords
  let x0=S, x1=0, y1=0;
  for(const m of q.items){
    if(m.t==='st'){ for(let i=0;i<m.pts.length;i+=2){ x0=Math.min(x0,m.pts[i]); x1=Math.max(x1,m.pts[i]); y1=Math.max(y1,m.pts[i+1]); } }
    else { x0=Math.min(x0,m.x); x1=Math.max(x1,m.x+m.text.length*m.size*.55); y1=Math.max(y1,m.y+m.size); }
  }
  return {x:Math.max(0,Math.min(S,(x0+x1)/2)), y:Math.min(S,y1)+14/view.s};
}
function paintReveal(){
  if(!reveal) return; const left = reveal.until - performance.now(), q = squares.get(reveal.sq);
  if(left<=0 || !q || !q.name){ reveal=null; return; }
  const p = fromLocal(q, inkBottom(q));
  ctx.save(); ctx.globalAlpha = Math.min(1, left/500);
  ctx.fillStyle=col.muted; ctx.font=`${12/view.s}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(q.name, p.x, p.y); ctx.restore(); draw();
}
function edgeAlpha(){ const left = spillUntil - performance.now(); if(left<=0) return 0; draw(); return Math.min(1, left/600); }
function spill(){ spillUntil = performance.now() + 1800; draw(); }

function paintItems(q, over, extra){
  ctx.lineCap='round'; ctx.lineJoin='round';
  const list = !over && localStroke && q===squares.get(mySq) ? q.items.concat([localStroke]) : q.items;
  for(const m of list){
    const c = over || col['ink'+(m.ink|0)] || col.ink0;
    if(m.t==='st'){
      const p=m.pts; ctx.strokeStyle=c; ctx.fillStyle=c; ctx.lineWidth=(m.w||3)+(extra||0);
      if(p.length<=4){ ctx.beginPath(); ctx.arc(p[0],p[1],(m.w||3)/2,0,7); ctx.fill(); continue; }
      ctx.beginPath(); ctx.moveTo(p[0],p[1]);
      for(let i=2;i<p.length-2;i+=2) ctx.quadraticCurveTo(p[i],p[i+1],(p[i]+p[i+2])/2,(p[i+1]+p[i+3])/2);
      ctx.lineTo(p[p.length-2],p[p.length-1]); ctx.stroke();
    } else if(m.t==='tx'){
      ctx.fillStyle=c; ctx.font=`${m.size||20}px ${getComputedStyle(document.body).fontFamily}`; ctx.textBaseline='top';
      ctx.fillText(m.text, m.x, m.y);
    }
  }
}
function paintSquare(id, q){
  ctx.save();
  ctx.translate(q.x,q.y); ctx.rotate(q.r); ctx.translate(-S/2,-S/2);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,S,S); ctx.clip(); paintItems(q);
  if(id===adminSel && adminItem){ const m=q.items.find(i=>i.id===adminItem); if(m) paintItems({items:[m]}, col.ink1, 4/view.s); }
  ctx.restore();
  const a = id===adminSel ? 1 : id===mySq ? (drag ? 1 : edgeAlpha()) : 0;
  if(a>0){
    ctx.globalAlpha=a; ctx.strokeStyle = id===adminSel ? col.ink1 : col.mine; ctx.lineWidth=2/view.s; ctx.setLineDash([6/view.s,5/view.s]);
    ctx.strokeRect(0,0,S,S); ctx.setLineDash([]);
  }
  if(id===mySq && a>0){ // rotate handle
    ctx.fillStyle=col.paper; ctx.strokeStyle=col.mine; ctx.lineWidth=2/view.s;
    ctx.beginPath(); ctx.arc(S+18,-18,11/view.s,0,7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(S+18,-18,5/view.s,-2.5,1.6); ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

// network mode: one circle per square, area by views
let bubbles = [];
function layoutBubbles(){
  const ids=[...squares.keys()], max=Math.max(1,...ids.map(i=>counts[i]||0));
  const prev=new Map(bubbles.map(b=>[b.id,b]));
  bubbles = ids.map(id=>{ const q=squares.get(id), n=counts[id]||0, p=prev.get(id);
    return {id, n, R: 70 + 230*Math.sqrt(n/max), x:p?p.x:q.x, y:p?p.y:q.y, top: n>0 && n===max}; });
  for(let it=0; it<60; it++){
    for(let i=0;i<bubbles.length;i++) for(let j=i+1;j<bubbles.length;j++){
      const a=bubbles[i], b=bubbles[j]; let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||.01; const m=a.R+b.R+16;
      if(d<m){ const k=(m-d)/2/d; dx*=k; dy*=k; a.x-=dx; a.y-=dy; b.x+=dx; b.y+=dy; }
    }
  }
}
function paintBubbles(){
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(const b of bubbles){
    const q=squares.get(b.id); if(!q) continue;
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.beginPath(); ctx.arc(0,0,b.R,0,7); ctx.fillStyle=col.paper; ctx.fill();
    ctx.save(); ctx.clip(); const k=(2*b.R)/S*1.05; ctx.scale(k,k); ctx.translate(-S/2,-S/2); paintItems(q); ctx.restore();
    ctx.lineWidth=(b.top?3:1)/view.s; ctx.strokeStyle=b.top?col.mine:col.edge; ctx.beginPath(); ctx.arc(0,0,b.R,0,7); ctx.stroke();
    ctx.fillStyle=col.muted; ctx.font=`${12/view.s}px ${getComputedStyle(document.body).fontFamily}`;
    const u=1/view.s, ey=b.R+13*u; ctx.strokeStyle=col.muted; ctx.lineWidth=1.5*u;
    ctx.beginPath(); ctx.ellipse(-12*u,ey,8*u,4.5*u,0,0,7); ctx.stroke(); ctx.beginPath(); ctx.arc(-12*u,ey,1.8*u,0,7); ctx.fill();
    ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(String(b.n), 0, ey); ctx.textAlign='center'; ctx.textBaseline='top';
    if(selBubble===b.id && q.name) ctx.fillText(q.name, 0, ey+12*u);
    ctx.restore();
  }
}

function render(){
  raf=0;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=col.desk; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);
  if(net){ paintBubbles(); }
  else{
    const tl=toWorld(0,0), br=toWorld(innerWidth,innerHeight), pad=S;
    [...squares].sort((a,b)=>a[1].z-b[1].z).forEach(([id,q])=>{
      if(q.x<tl.x-pad||q.x>br.x+pad||q.y<tl.y-pad||q.y>br.y+pad) return;
      paintSquare(id,q);
    });
    paintReveal();
  }
  $('hint').hidden = squares.size>0 || day===null;
}

// ---------- input ----------
const ptrs=new Map(); let pinch=null, pan=null, drag=null, tap=null;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ localStroke=null; pan=drag=maybe=null; const p=pp(); pinch={...p, v:{...view}}; draw(); return; }
  if(ptrs.size>2) return;
  const w=toWorld(e.clientX,e.clientY);
  tap={x:e.clientX,y:e.clientY};
  if(net){ pan={x:e.clientX,y:e.clientY}; return; }
  if(!$('namebox').hidden && document.activeElement!==$('name')) closeName();
  if(adminOn()){ pan={x:e.clientX,y:e.clientY}; cv.classList.add('grabbing'); return; }
  if(mode!=='move'){
    const mine = mySq && squares.get(mySq);
    if(!(mine && inside(toLocal(mine,w))) && topWithInkAt(w,true)){ maybe={w, x:e.clientX, y:e.clientY}; return; }
  }
  startAt(e, w);
});
function startAt(e, w){
  let q=mySq && squares.get(mySq);
  if(!q && mode!=='move' && day){ q = claimAt(w); }
  if(q){
    const h=toScreen(...Object.values(rotHandle(q)));
    if(edgeAlpha()>0 && Math.hypot(h.x-e.clientX,h.y-e.clientY)<22){ drag={kind:'rot', a0:Math.atan2(w.y-q.y,w.x-q.x)-q.r}; return; }
    const l=toLocal(q,w);
    if(mode==='move' && inside(l)){ drag={kind:'move', dx:w.x-q.x, dy:w.y-q.y}; cv.classList.add('grabbing'); return; }
    if(mode==='draw'){ if(!inside(l)) spill(); localStroke={t:'st',id:rid(),ink,w:Math.max(1.5,Math.min(8,3/view.s)),pts:[r1(cl(l.x)),r1(cl(l.y))]}; draw(); return; }
    if(mode==='text'){ e.preventDefault?.(); if(!inside(l)){ spill(); return; } openText(e.clientX,e.clientY,l); return; }
  }
  pan={x:e.clientX,y:e.clientY}; cv.classList.add('grabbing');
}
const r1=n=>Math.round(n*10)/10, cl=n=>Math.max(-20,Math.min(S+20,n));
cv.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){ const p=pp(), s=Math.min(6,Math.max(.08,pinch.v.s*p.d/pinch.d)), k=s/pinch.v.s;
    view={s, x:p.mx-(pinch.mx-pinch.v.x)*k, y:p.my-(pinch.my-pinch.v.y)*k}; draw(); return; }
  if(maybe){
    if(Math.hypot(e.clientX-maybe.x,e.clientY-maybe.y)<6) return;
    const m=maybe; maybe=null; startAt({clientX:m.x, clientY:m.y}, m.w);
  }
  const w=toWorld(e.clientX,e.clientY), q=mySq&&squares.get(mySq);
  if(drag && q){
    if(drag.kind==='move'){ q.x=w.x-drag.dx; q.y=w.y-drag.dy; }
    else q.r=Math.atan2(w.y-q.y,w.x-q.x)-drag.a0;
    q.z=Number.MAX_SAFE_INTEGER; draw(); return;
  }
  if(localStroke && q){ const l=toLocal(q,w), p=localStroke.pts;
    if(!inside(l)) spill();
    if(Math.hypot(l.x-p[p.length-2],l.y-p[p.length-1])>1.5/view.s && p.length<2998){ p.push(r1(Math.max(-20,Math.min(S+20,l.x))), r1(Math.max(-20,Math.min(S+20,l.y)))); draw(); } return; }
  if(pan){ view.x+=e.clientX-pan.x; view.y+=e.clientY-pan.y; pan={x:e.clientX,y:e.clientY}; draw(); }
});
function end(e){
  ptrs.delete(e.pointerId); cv.classList.remove('grabbing');
  if(pinch){ if(ptrs.size<2) pinch=null; return; }
  const wasTap = tap && Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<6; tap=null;
  if(adminOn() && !net){ pan=null; if(wasTap) adminPick(toWorld(e.clientX,e.clientY)); return; }
  if(maybe){ const t=topWithInkAt(maybe.w,true); maybe=null; if(t){ reveal={sq:t[0], until:performance.now()+4000}; draw(); return; } }
  if(drag){ const q=squares.get(mySq); drag=null; spill(); if(q){ pendingMove++; send({t:'sq',x:q.x,y:q.y,r:q.r}).finally(()=>pendingMove--); } return; }
  if(localStroke){ const s=localStroke, q=squares.get(mySq); localStroke=null;
    if(q){ q.items.push(s); q.z=Number.MAX_SAFE_INTEGER; ui(); draw();
      send(s).catch(()=>{ q.items=q.items.filter(i=>i!==s); draw(); ui(); }); }
    return; }
  pan=null;
  if(wasTap && net){ const w=toWorld(e.clientX,e.clientY); const b=bubbles.find(b=>Math.hypot(b.x-w.x,b.y-w.y)<b.R);
    if(b && selBubble===b.id){ net=false; selBubble=null; ui(); flyTo(b.id); }
    else { selBubble = b ? b.id : null; draw(); } }
  else if(wasTap && mode==='move'){ const t=topWithInkAt(toWorld(e.clientX,e.clientY),false); if(t){ reveal={sq:t[0], until:performance.now()+4000}; draw(); } }
}
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', e=>{ ptrs.delete(e.pointerId); pinch=pan=maybe=null; localStroke=null; if(drag){drag=null;} draw(); });
function pp(){ const [a,b]=[...ptrs.values()]; return {mx:(a.x+b.x)/2,my:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)||1}; }
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey||(!e.deltaX&&Math.abs(e.deltaY)>=40)){
    const s=Math.min(6,Math.max(.08,view.s*Math.exp(-e.deltaY*.0015))), k=s/view.s;
    view={s, x:e.clientX-(e.clientX-view.x)*k, y:e.clientY-(e.clientY-view.y)*k};
  } else { view.x-=e.deltaX; view.y-=e.deltaY; }
  draw();
},{passive:false});

// text
const ti=$('ti'); let tiAt=null;
function openText(sx,sy,l){
  commitText(); tiAt={x:l.x,y:l.y,ink,size:20};
  ti.hidden=false; ti.value=''; ti.style.left=sx+'px'; ti.style.top=sy+'px';
  ti.style.fontSize=(20*view.s)+'px'; ti.style.color=col['ink'+ink];
  ti.focus();
}
function commitText(){
  if(!tiAt) return; const t=ti.value.trim(), at=tiAt; tiAt=null; ti.hidden=true; ti.value='';
  const q=squares.get(mySq); if(!t||!q) return;
  const it={t:'tx',id:rid(),ink:at.ink,size:at.size,x:Math.round(Math.max(0,Math.min(S,at.x))),y:Math.round(Math.max(0,Math.min(S,at.y))),text:t};
  q.items.push(it); ui(); draw(); send(it).catch(()=>{ q.items=q.items.filter(i=>i!==it); draw(); ui(); });
}
ti.addEventListener('keydown',e=>{ if(e.key==='Enter') commitText(); if(e.key==='Escape'){ tiAt=null; ti.hidden=true; } });
ti.addEventListener('blur',commitText);
ti.addEventListener('input',()=>{
  if(!tiAt) return;
  ctx.save(); ctx.font=`${tiAt.size}px ${getComputedStyle(document.body).fontFamily}`;
  const w=ctx.measureText(ti.value).width; ctx.restore();
  if(tiAt.x+w>S || tiAt.y+tiAt.size>S) spill();
});

// ---------- views ----------
const seenTime = {}; let queue = [];
function seenKey(){ return 'bp-seen-'+day; }
function reported(){ try{ return new Set(JSON.parse(store.get(seenKey())||'[]')); }catch{ return new Set(); } }
setInterval(()=>{
  if(document.hidden || net || !day) return;
  const done = reported();
  for(const [id,q] of squares){
    if(id===mySq || done.has(id) || queue.includes(id)) continue;
    const p=toScreen(q.x,q.y), big=S*view.s>=90;
    if(big && p.x>0 && p.y>0 && p.x<innerWidth && p.y<innerHeight){ if((seenTime[id]=(seenTime[id]||0)+1)>=2) queue.push(id); }
    else seenTime[id]=0;
  }
}, 1000);
setInterval(async ()=>{
  if(!queue.length) return;
  const batch=queue.splice(0,40);
  try{ await post('/api/view',{sqs:batch}); const d=reported(); batch.forEach(b=>d.add(b)); store.set(seenKey(), JSON.stringify([...d])); }
  catch{ queue.unshift(...batch); }
}, 4000);
async function loadCounts(){
  try{ const r=await fetch('/api/views',{cache:'no-store'}); const d=await r.json(); if(d.day===day) counts=d.counts||{}; }catch{}
  layoutBubbles(); draw();
}
setInterval(()=>{ if(net && !document.hidden) loadCounts(); }, 6000);

// ---------- admin (#admin) ----------
const admin = location.hash==='#admin';
let adminSession = null, adminItem = null;
try{ adminSession = sessionStorage.getItem('bp-admin'); }catch{}
const adminOn = () => admin && !!adminSession;
function adminUi(){
  $('admin').hidden = !admin;
  $('atools').hidden = !adminOn(); $('gbtn').hidden = adminOn();
  $('adel').disabled = !adminSel; $('aitem').disabled = !adminItem;
}
async function adminLogin(credential){
  try{
    const r = await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ note(r.status===403 ? 'החשבון הזה אינו מנהל' : 'הכניסה נכשלה'); return; }
    adminSession = d.session; try{ sessionStorage.setItem('bp-admin', adminSession); }catch{}
    note(''); adminUi(); draw();
  }catch{ note('הכניסה נכשלה'); }
}
function adminLogout(){ adminSession=null; adminSel=null; adminItem=null; try{ sessionStorage.removeItem('bp-admin'); }catch{} adminUi(); draw(); }
function adminPick(w){
  const t = topWithInkAt(w,false) || topSquareAt(w);
  adminSel = t ? t[0] : null; adminItem = null;
  if(t){
    const q=t[1], l=toLocal(q,w), tol=16/view.s; let best=tol;
    for(const m of q.items){
      let d=Infinity;
      if(m.t==='st'){ for(let i=0;i<m.pts.length;i+=2) d=Math.min(d, Math.hypot(m.pts[i]-l.x, m.pts[i+1]-l.y)); }
      else if(l.x>=m.x-4 && l.x<=m.x+m.text.length*m.size*.6 && l.y>=m.y-4 && l.y<=m.y+m.size+4) d=0;
      if(d<best){ best=d; adminItem=m.id; }
    }
    reveal = {sq:t[0], until:performance.now()+4000};
  }
  adminUi(); draw();
}
async function adminDelete(withItem){
  if(!adminSel) return;
  try{
    const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session:adminSession, sq:adminSel, id: withItem ? adminItem : undefined})});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){ adminLogout(); note('צריך להתחבר שוב'); return; }
    if(!r.ok){ note('המחיקה נכשלה'); return; }
    apply(d.ev); adminItem=null; if(!withItem) adminSel=null; adminUi(); draw();
  }catch{ note('המחיקה נכשלה'); }
}
if(admin){
  $('adel').onclick = () => adminDelete(false);
  $('aitem').onclick = () => adminDelete(true);
  $('aout').onclick = adminLogout;
  if(location.hostname==='localhost') window.bpAdminLogin = adminLogin;
  fetch('/api/config').then(r=>r.json()).then(c=>{
    if(!c.googleClientId){ if(!adminOn()) note('כניסת מנהל עוד לא הוגדרה'); return; }
    const g=document.createElement('script'); g.src='https://accounts.google.com/gsi/client'; g.async=true;
    g.onload=()=>{ google.accounts.id.initialize({client_id:c.googleClientId, callback:r=>adminLogin(r.credential)});
      google.accounts.id.renderButton($('gbtn'),{type:'icon',shape:'circle',theme:'outline',size:'medium'}); };
    document.head.appendChild(g);
  }).catch(()=>{});
  adminUi();
}

// ---------- clock ----------
function tick(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value, left=86400-((g('hour')%24)*3600+g('minute')*60+g('second'));
  const f=n=>String(n).padStart(2,'0');
  $('clockt').textContent=`${f(Math.floor(left/3600))}:${f(Math.floor(left%3600/60))}:${f(left%60)}`;
}

// ---------- boot ----------
addEventListener('resize', resize);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
readColors(); resize(); tick(); setInterval(tick,1000);
poll().then(()=>{ ui(); if(mySq && squares.has(mySq)) flyTo(mySq); });
setInterval(poll, 1500);
ui();
})();
</script>
</body>
